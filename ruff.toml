target-version = "py311"
line-length = 140

[lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B905", "E731"]

[lint.flake8-bugbear]
# FastAPI declares dependencies and parameters through call defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body"]
